 title="2">★</label>
                    <input type="radio" name="rating" id="f1" value="1" /><label for="f1" title="1 — Not useful">★</label>
                  </div>
                  <p class="f-error" data-err="rating"></p>
                </div>
                <div class="f-row">
                  <p class="f-label">Will you try the styling tip?</p>
                  <div class="seg">
                    <label><input type="radio" name="tryTip" value="yes" /> Yes</label>
                    <label><input type="radio" name="tryTip" value="maybe" /> Maybe</label>
                    <label><input type="radio" name="tryTip" value="no" /> No</label>
                  </div>
                  <p class="f-error" data-err="tryTip"></p>
                </div>
                <div class="f-row">
                  <label class="f-label" for="fb-comment">Comments <span class="f-count" id="fb-count">0 / 300</span></label>
                  <textarea class="f-input" id="fb-comment" name="comment" maxlength="300" placeholder="What was most helpful? What was missing?"></textarea>
                  <p class="f-hint" id="fb-hint">Optional — required if you rate 2 stars or fewer.</p>
                  <p class="f-error" data-err="comment"></p>
                </div>
                <button type="submit" class="submit">SEND FEEDBACK</button>
              </div>
              <div class="fb-thanks" hidden>
                <p class="serif" style="font-size: 22px">Thank you — <em>noted.</em></p>
                <p id="fb-summary"></p>
                <button type="button" class="clear" id="fb-again">Leave more feedback</button>
              </div>
            </form>

            <div class="databar">
              <span><span class="dot"></span>Notes saved locally as JSON · <b id="data-count">0</b> records</span>
              <span class="actions">
                <button type="button" id="export-json">Export JSON</button>
                <label>Import JSON<input type="file" id="import-json" accept=".json,application/json" hidden /></label>
              </span>
            </div>
          </div>

          <form class="chat" id="chat-form" novalidate>
            <label for="chat-input"><small>Ask the AI a styling question…</small></label>
            <div class="f-row" style="margin: 0">
              <div class="row">
                <input id="chat-input" name="question" maxlength="200" autocomplete="off" placeholder="e.g. What shoes would work better for evening?" />
                <button type="submit" class="send" aria-label="Send question">→</button>
              </div>
              <p class="f-error" data-err="question"></p>
            </div>
            <div class="sugg" id="sugg"></div>
          </form>
        </aside>
      </div>
    </div>
    <script type="module" src="notes.js"></script>
  </body>
</html>
